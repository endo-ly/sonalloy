[package]
name = "sonalloy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sonalloy"
path = "src/main.rs"

[dependencies]
sonalloy-cli-core = { path = "../sonalloy-cli-core" }

[build-dependencies]
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
hound = "3.5.1"
midly = "0.5.3"
predicates = "3.1.4"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"

[lints]
workspace = true
