[workspace]
resolver = "3"
members = [
    "crates/sonalloy-core",
    "crates/sonalloy-dsp-sys",
    "crates/sonalloy-cli",
    "crates/sonalloy-capi",
]

[workspace.package]
version = "2026.9.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "JSON-defined hybrid instrument engine for realtime performance and offline rendering"
repository = "https://github.com/endo-ly/sonalloy"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
