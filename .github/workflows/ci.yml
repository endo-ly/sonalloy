name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      SONALLOY_DSP_TEST_HOOKS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: CLI smoke render
        run: cargo run -p sonalloy-cli -- dev render-sine --frequency 440 --duration 0.01 --sample-rate 48000 --block-size 257 --output ci-sine.wav

  linux:
    runs-on: ubuntu-latest
    env:
      SONALLOY_DSP_TEST_HOOKS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: CLI smoke render
        run: cargo run -p sonalloy-cli -- dev render-sine --frequency 440 --duration 0.01 --sample-rate 48000 --block-size 257 --output ci-sine.wav

  linux-native-sanitizer:
    runs-on: ubuntu-latest
    env:
      SONALLOY_DSP_TEST_HOOKS: 1
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      RUSTFLAGS: -C link-arg=-fsanitize=address -C link-arg=-fsanitize=undefined
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++
      - name: FFI sanitizer test
        run: cargo test -p sonalloy-dsp-sys
