name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Debug C++ C ABI consumer link
        shell: pwsh
        run: ./scripts/verify-msvc-capi-consumer.ps1 -Configuration Debug
      - name: Release build
        run: cargo build --workspace --release
      - name: Release C++ C ABI consumer link
        shell: pwsh
        run: ./scripts/verify-msvc-capi-consumer.ps1 -Configuration Release
      - name: CLI smoke render
        run: cargo run -p sonalloy-cli -- dev render-sine --frequency 440 --duration 0.01 --sample-rate 48000 --block-size 257 --output ci-sine.wav
      - name: Spectral reference smoke
        run: cargo run -p sonalloy-cli -- instrument validate testdata/instruments/spectral-generator-reference.json --json
      - name: Spectral hybrid MIDI smoke
        run: cargo run -p sonalloy-cli -- render midi testdata/instruments/spectral-hybrid-reference.json testdata/midi/basic-poly-synth-phrase.mid --sample-rate 48000 --block-size 257 --tail 0.1 --output ci-spectral-hybrid.wav --json
      - name: External audio CLI smoke
        run: cargo run -p sonalloy-cli -- render events review/external-audio-cross-synthesis/definitions/sidechain-ducking.json review/external-audio-cross-synthesis/events/sidechain-ducking.json --audio-input review/external-audio-cross-synthesis/assets/sidechain-kick.wav --duration-frames 72001 --sample-rate 48000 --block-size 257 --tail 0 --output ci-external-audio.wav --analyze --json

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++ pkg-config libasound2-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: CLI smoke render
        run: cargo run -p sonalloy-cli -- dev render-sine --frequency 440 --duration 0.01 --sample-rate 48000 --block-size 257 --output ci-sine.wav
      - name: Spectral reference smoke
        run: cargo run -p sonalloy-cli -- instrument validate testdata/instruments/spectral-generator-reference.json --json
      - name: Spectral hybrid MIDI smoke
        run: cargo run -p sonalloy-cli -- render midi testdata/instruments/spectral-hybrid-reference.json testdata/midi/basic-poly-synth-phrase.mid --sample-rate 48000 --block-size 257 --tail 0.1 --output ci-spectral-hybrid.wav --json
      - name: External audio CLI smoke
        run: cargo run -p sonalloy-cli -- render events review/external-audio-cross-synthesis/definitions/sidechain-ducking.json review/external-audio-cross-synthesis/events/sidechain-ducking.json --audio-input review/external-audio-cross-synthesis/assets/sidechain-kick.wav --duration-frames 72001 --sample-rate 48000 --block-size 257 --tail 0 --output ci-external-audio.wav --analyze --json

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: CLI smoke render
        run: cargo run -p sonalloy-cli -- dev render-sine --frequency 440 --duration 0.01 --sample-rate 48000 --block-size 257 --output ci-sine.wav
      - name: Spectral reference smoke
        run: cargo run -p sonalloy-cli -- instrument validate testdata/instruments/spectral-generator-reference.json --json
      - name: Spectral hybrid MIDI smoke
        run: cargo run -p sonalloy-cli -- render midi testdata/instruments/spectral-hybrid-reference.json testdata/midi/basic-poly-synth-phrase.mid --sample-rate 48000 --block-size 257 --tail 0.1 --output ci-spectral-hybrid.wav --json
      - name: External audio CLI smoke
        run: cargo run -p sonalloy-cli -- render events review/external-audio-cross-synthesis/definitions/sidechain-ducking.json review/external-audio-cross-synthesis/events/sidechain-ducking.json --audio-input review/external-audio-cross-synthesis/assets/sidechain-kick.wav --duration-frames 72001 --sample-rate 48000 --block-size 257 --tail 0 --output ci-external-audio.wav --analyze --json

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Dependency vulnerability scan
        run: cargo audit

  linux-native-fault-injection:
    runs-on: ubuntu-latest
    env:
      SONALLOY_DSP_TEST_HOOKS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++
      - name: Native fault-injection tests
        run: cargo test -p sonalloy-dsp-sys

  linux-native-sanitizer:
    runs-on: ubuntu-latest
    env:
      SONALLOY_DSP_TEST_HOOKS: 1
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      RUSTFLAGS: >-
        -C link-arg=-fsanitize=address
        -C link-arg=-fsanitize=undefined
        -C link-arg=-lasan
        -C link-arg=-lubsan
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install --yes cmake g++
      - name: FFI sanitizer test
        run: |
          cargo test -p sonalloy-dsp-sys --no-run
          asan_runtime="$(g++ -print-file-name=libasan.so)"
          for test_binary in target/debug/deps/sonalloy_dsp_sys-* target/debug/deps/ffi-*; do
            if [[ -x "$test_binary" ]]; then
              LD_PRELOAD="$asan_runtime" "$test_binary" --test-threads=1
            fi
          done
