  ride: {preset: DRUM/024-bright-ping-ride, gain_db: -10, role: drums}
  shaker: {preset: DRUM/011-noise-shaker, gain_db: -12, role: drums}
  rim: {preset: DRUM/010-woody-rim-click, gain_db: -9, role: drums}
  cowbell: {preset: DRUM/021-808-cowbell, gain_db: -12, role: drums}
  tamb: {preset: DRUM/025-rattle-burst-tambourine, gain_db: -10, role: drums}
  crash: {preset: DRUM/008-wide-wash-crash, gain_db: -11, role: drums}
  riser: {preset: FX/001-noise-riser, gain_db: -6, role: fx}
  impact: {preset: FX/008-noise-crash-impact, gain_db: -5, role: fx}
  subdrop: {preset: FX/004-sub-drop, gain_db: -8, role: fx}
  glitch: {preset: FX/005-glitch-burst, gain_db: -5, role: fx}
  tapestop: {preset: FX/009-tape-stop-slowdown, gain_db: -6, role: fx}
