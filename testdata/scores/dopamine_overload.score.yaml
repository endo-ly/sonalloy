drums:
  verse:
    parts:
      kick: "X... | .... | ..x. | ...."
      rim: ".... | x... | .... | x..."
      hat: "x.o. | x.o. | x.o. | x.o."
      shaker: "xoxo | xoxo | xoxo | xoxo"
    overrides:
      - when: {odd: true}
        parts: {kick: X... | ...o | ..x. | ....}
      - when: {bar: last}
        parts: {snare: '.... | .... | .... | oxxX'}
  pre:
    parts:
      kick: "x... | x... | x... | x..."
      clap: ".... | x... | .... | x..."
      hat: "o.o. | o.o. | x.x. | x.x."
  kime:
    parts:
      kick: "X..x | ..x. | ..x. | x..."
      clap: ".... | x... | .... | x..."
      hat: "xoxo | xoxo | xoxo | xoxo"
  otosabi:
    parts:
      kick: "x... | .... | .... | ...."
      rim: ".... | x... | .... | x..."
      shaker: "o.o. | o.o. | o.o. | o.o."
    overrides:
      - when: {odd: true}
        parts: {kick: x... | .... | ..o. | ....}
  four:
    parts:
      kick: "X... | X... | X... | X..."
      clap: ".... | X... | .... | X..."
      snare: ".... | x... | .... | x..."
      hat: "XxXx | XxXx | XxXx | XxXx"
      openhat: "..x. | ..x. | ..x. | ..x."
    overrides:
      - when: {odd: true}
        parts: {hat: 'XxXx | XxXx | XxXx | [oxXoxXoxXoxX]'}
      - when: {every: 4}
        parts: {kick: X... | X... | X... | Xooo}
  mega:
    from: four
    parts:
      tamb: "...x | ...x | ...x | ...x"
    overrides:
      - when: {bar: 5}
        parts: {crash: X... | .... | .... | ....}
  trap:
    parts:
      kick: "X... | .... | ..x. | ...."
      snare2: ".... | .... | X... | ...."
      clap: ".... | .... | x... | ...."
      hat2: "X.x. | X.x. | X.x. | X.x."
    overrides:
      - when: {odd: true}
        parts: {kick: X... | ...x | ..x. | ...., hat2: 'X.x. | X.x. | X.x. | [oooxxx]'}
  chip:
    parts:
      kick: "X... | .... | X.x. | ...."
      snare: ".... | x... | .... | x..."
      hat: "X.x. | X.x. | X.x. | X.x."
      cowbell: "...x | ..x. | ...x | ..x."
  halftime:
    parts:
      kick: "X... | ...x | .... | ...."
      snare2: ".... | .... | X... | ...."
      clap: ".... | .... | x... | ...."
      ride: "X.x. | X.x. | X.x. | X.x."
    overrides:
      - when: {odd: true}
        parts: {kick: X... | ...x | ...x | ....}
      - when: {bar: last}
        parts: {snare2: '.... | .... | .... | [oooxxxXX]'}
bass:
  verse:
    parts:
      b808: "R - - - | - - . . | . . R - | R - - -"
  '808':
    choices:
      T:
        odd: N'
        even: R5
    parts:
      b808: "R - - R | - - R' - | R - R - | R' - T -"
  trap:
    parts:
      b808: "R' - - R' | - - . . | . . R' - | . R5' - -"
  kime:
    parts:
      pluckbass: "R - . R | - . R' - | . . R - | R' - . ."
  octave8:
    parts:
      pluckbass: "R - R' - | R - R' - | R - R' - | R - R' -"
  sustain:
    parts:
      reese: "R' - - - | - - - - | - - - - | - - - -"
comp:
  hold: "x - - - | - - - - | - - - - | - - - -"
  offbeat: ". . x - | . . x - | . . x - | . . x -"
  8ths: "x . x . | x . x . | x . x . | x . x ."
  tresillo: "x . . x | . . x . | . . x . | x . . ."
  stab: "x . . x | . . x . | . . x . | . . . ."
arps:
  crystal:
    order: 0 1 2 3 | 2 1 2 3 | 0 1 2 3 | 3 2 1 2
    voicing_floor_midi: 72
    retrigger_each_step: true
counters:
  bell:
    when: lead_silent_full_beat
    cell: 1' 6 5 6
  bell_minor:
    when: lead_silent_full_beat
    cell: 1' b6 5 b6
macros:
  drop:
    kind: hits
    at: {bar: 1, step: 1}
    instruments:
      - crash
      - impact
      - subdrop
  gasp:
    kind: silence
    at: {bar: last, step: 13}
    duration_steps: 4
    except_instruments:
      - chop
  hey:
    kind: degree
    instrument: chop
    degree: '5'
    at: {bar: last, step: 13}
    duration_steps: 1
    velocity: 124
  roll:
    kind: drum_roll
    instrument: snare
    bars: 2
    early_hits_per_beat: 2
    final_hits_per_beat: 4
    last_bar_end_beat: 3
    velocity_from: 85
    velocity_to: 120
    riser: riser
instruments:
