transitions:
  - from: post
    to: verse2
    method: common-tone
    description: E♭ の3度 G だけを残し、新しい主音にする
  - from: verse2
    to: pre2
    method: pivot
    description: 同じルートのまま5度を戻して、E の vi として着地
  - from: chorus2
    to: bridge
    method: flat-VI
    description: サビ2の最後に E → C（♭VI）。C の平行調 Am へ
  - from: bridge
    to: build
    method: pivot+backdoor
    description: Dm7（Am の iv = F の vi）を軸に、E♭maj7（♭VII）を経て C7 へ
  - from: build
    to: final
    method: dominant
    description: C7sus4 → Caug → F
  - from: finalB
    to: final2
    method: direct
    description: 準備なし、短3度上へ
notes: |
  - 曲は1曲として聴こえること（メドレーにしない）。背骨: キック、808、フックのモチーフ
  - リードの音色はセクションごとに替える。formant（singer）はブリッジだけ
  - 声ネタは合いの手として、リードの隙間にだけ。多すぎるとくどい、ゼロだと寂しい
  - 2回目のセクションは基盤を共有し、要所だけ変える（サビ2: キー・クリシェ・ストップ・5小節目）
  - メロディの最高音は F5 まで

