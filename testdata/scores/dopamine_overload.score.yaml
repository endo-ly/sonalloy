# DOPAMINE OVERLOAD — Sonalloyデモ用楽譜（仕様: score_spec.md）
# 12平均律 / 主音=1 / 同主長調基準 / scale は演奏音高を自動変更しない

meta:
  title: DOPAMINE OVERLOAD
  bpm: 168
  meter: 4/4
  tuning: 12edo
  reference_octave: 4
  gate: 0.92
  master:
    target_lufs: -12
    max_true_peak_db: -1
    target_lra_lu: 7
form:
  - {section: intro, bars: 4, tonic: C, scale: aeolian}
  - {section: verse1, bars: 8, tonic: Eb, scale: ionian}
  - {section: pre1, bars: 4, tonic: Eb, scale: ionian}
  - {section: chorus1, bars: 8, tonic: Eb, scale: ionian}
  - {section: post, bars: 4, tonic: Eb, scale: ionian}
  - {section: verse2, bars: 4, tonic: G, scale: ionian}
  - {section: pre2, bars: 4, tonic: E, scale: ionian}
  - {section: chorus2, bars: 8, tonic: E, scale: ionian}
  - {section: bridge, bars: 6, tonic: A, scale: aeolian}
  - {section: build, bars: 2, tonic: F, scale: ionian}
  - {section: final, bars: 4, tonic: F, scale: ionian}
  - {section: finalB, bars: 4, tonic: F, scale: ionian}
  - {section: final2, bars: 8, tonic: Ab, scale: ionian}
  - {section: outro, bars: 2, tonic: Ab, scale: ionian}
sections:
  intro:
    chords:
      - "1:m 1:m/b7"
      - "b6:maj7"
      - "4:m7 4:m7/b3"
      - "b7:7sus4 b7:7"
    lead: {instrument: kalimba, melody: intro}
    pad: {instrument: glasspad, pattern: hold}
    velocity: 90
  verse1:
    chords:
      - "1:maj 1:maj/7"
      - "6:m7 6:m7/5"
      - "4:maj7"
      - "#4:m7b5 5:maj"
      - "1:maj/3"
      - "4:maj #4:dim7"
      - "2:m7"
      - "5:sus4 5:7"
    lead: {instrument: tine, melody: verse}
    drums: verse
    bass: {pattern: verse}
    comp:
      fmep: offbeat
    answers:
      - {instrument: chop, melody: answers.pickup, at: {bar: 1, step: 1}}
      - {instrument: chop, melody: answers.pickup, at: {bar: 5, step: 1}}
    velocity: 92
  pre1:
    chords:
      - "4:maj7"
      - "#4:dim7"
      - "5:sus4"
      - "5:7"
    lead: {instrument: fmlead, melody: pre}
    drums: pre
    bass: {pattern: octave8}
    comp:
      brass: 8ths
    velocity: 100
    events:
      - {macro: roll}
      - {macro: gasp}
      - {macro: hey}
  chorus1:
    chords:
      - "4:maj7 5:7"
      - "3:m7 6:7"
      - "2:m7 5:7/7"
      - "1:maj 1:7"
      - "4:maj 4:m"
      - "6:m7 2:7"
      - "2:m7 5:7"
      - "1:maj"
    lead: {instrument: hook, melody: hook}
    drums: four
    bass: {pattern: '808'}
    comp:
      supersaw: hold
    arp: {instrument: crystal, pattern: crystal}
    answers:
      - {instrument: chop, melody: answers.gap, at: {bar: 4, step: 1}}
      - {instrument: chop, melody: answers.end, at: {bar: 8, step: 1}}
    velocity: 112
    events:
      - {macro: drop}
      - {kind: hit, at: {bar: 4, step: 14}, instrument: glitch}
  post:
    chords:
      - "6:m 6:m/5"
      - "4:maj7 1:maj/3"
      - "2:m7 2:m7/1"
      - "5:maj NC"
    drums: trap
    bass: {pattern: trap}
    comp:
      fmep: stab
    velocity: 110
    events:
      - {kind: hit, at: {bar: 1, step: 1}, instrument: crash}
    placements:
      - {instrument: chop, melody: riff, at: {bar: 1, step: 1}}
      - {instrument: donk, melody: riff, transpose: -12, at: {bar: 1, step: 1}}
      - {instrument: donk, melody: riff, transpose: -12, gain_db: 3, at: {bar: 2, step: 1}}
      - {instrument: chop, melody: riff, slice_steps: {start: 10, count: 7}, at: {bar: 2, step: 10}}
      - {instrument: chop, melody: riff_inv, at: {bar: 3, step: 1}}
      - {instrument: donk, melody: riff_inv, transpose: -12, at: {bar: 3, step: 1}}
      - {instrument: chop, melody: riff, slice_steps: {start: 1, count: 8}, at: {bar: 4, step: 1}}
      - {instrument: donk, melody: riff, slice_steps: {start: 1, count: 8}, transpose: -12, at: {bar: 4, step: 1}}
      - {instrument: hook, degree: '3', at: {bar: 4, step: 8}, duration_steps: 8}
      - {instrument: glasspad, degree: '3', transpose: -12, at: {bar: 4, step: 8}, duration_steps: 8}
    bass_overrides:
      - bar: 4
        parts:
          b808: R' - - R' | - - . . | . . . . | . . . .
  verse2:
    chords:
      - "1:maj 1:maj/7"
      - "6:m7 6:m7/5"
      - "4:maj7"
      - "#4:m7b5 5:maj"
    lead: {instrument: pulse, melody: verse2}
    drums: chip
    bass: {pattern: octave8}
    comp:
      pulsestab: offbeat
    answers:
      - {instrument: chop, melody: answers.tail_dn, at: {bar: 2, step: 1}}
    velocity: 95
  pre2:
    chords:
      - "6:m7 6:m7/5"
      - "4:maj7 #4:m7b5"
      - "3:m7 6:7"
      - "2:m7/5 5:7"
    lead: {instrument: hardsync, melody: pre2}
    drums: kime
    bass: {pattern: kime}
    comp:
      chrome: tresillo
    answers:
      - {instrument: chop, melody: answers.pickup, at: {bar: 4, step: 1}}
    velocity: 106
    events:
      - {macro: roll, bars: 1}
      - {macro: gasp}
  chorus2:
    from: chorus1
    chords:
      - "4:maj7 5:7"
      - "3:m7 6:7"
      - "2:m7 5:7/7"
      - "1:maj 1:7/b7"
      - "4:maj/6 4:m/b6"
      - "6:m7/5 2:7/#4"
      - "2:m7/4 5:7"
      - "1:maj b6:maj"
    lead:
      instrument: hook
      melody: hook2
      layers:
        - instrument: pulse
          transpose: 0
    comp:
      supersaw: hold
      chrome: tresillo
    velocity: 116
    events:
      - {macro: drop}
      - {kind: hit, at: {bar: 4, step: 14}, instrument: glitch}
      - {kind: silence, at: {bar: 5, step: 1}, duration_steps: 8, except_instruments: [hook, pulse, chop]}
  bridge:
    chords:
      - "1:m 1:m/b7"
      - "6:m7b5 b6:maj7"
      - "b3:maj/5"
      - "b7:maj"
      - "4:m7 4:m7/b3"
      - "2:m7b5 5:7"
    lead: {instrument: singer, melody: bridge}
    drums: halftime
    bass: {pattern: sustain}
    comp:
      bloom: hold
    pad: {instrument: glasspad, pattern: hold}
    counter: {instrument: bell, pattern: bell_minor}
    answers:
      - {instrument: chop, melody: answers.tail_dn_minor, at: {bar: 2, step: 1}}
      - {instrument: chop, melody: answers.tail_dn_minor, at: {bar: 4, step: 1}}
    velocity: 96
    events:
      - {kind: hit, at: {bar: 1, step: 1}, instrument: crash}
  build:
    chords:
      - "6:m7 b7:maj7"
      - "5:7sus4 5:aug"
    lead: {instrument: fmlead, melody: build}
    drums: pre
    bass: {pattern: octave8}
    comp:
      brass: 8ths
    velocity: 108
    events:
      - {macro: roll, bars: all}
      - {macro: gasp}
      - {macro: hey}
      - {kind: part_window, instrument: clap, bars: [1, 1]}
  final:
    chords:
      - "4:maj7 5:7"
      - "3:m7 6:7"
      - "2:m7 5:7/7"
      - "1:maj 1:7/b7"
    lead:
      instrument: mono
      melody: hook
      slice_bars:
        - 1
        - 4
    drums: otosabi
    bass: {pattern: verse}
    comp:
      bloom: hold
    pad: {instrument: glasspad, pattern: hold}
    velocity: 100
    events:
      - {macro: roll, bars: 1}
      - {macro: gasp}
  finalB:
    chords:
      - "4:maj/6 4:m/b6"
      - "6:m7/5 2:7/#4"
      - "2:m7/4 5:7"
      - "1:maj"
    lead:
      instrument: hook
      melody: hook
      slice_bars:
        - 5
        - 8
      layers:
        - instrument: mono
          transpose: 0
    drums: four
    bass: {pattern: '808'}
    comp:
      supersaw: hold
      chrome: tresillo
    arp: {instrument: crystal, pattern: crystal}
    answers:
      - {instrument: chop, melody: answers.end, at: {bar: 4, step: 1}}
    velocity: 120
    events:
      - {macro: drop}
      - {kind: step_roll, instrument: snare, bar: last, from_step: 8, through_step: 15, velocity_from: 80, velocity_to: 120}
  final2:
    chords:
      - "4:maj7 5:maj/4"
      - "3:m7 6:7"
      - "2:m7 #2:dim7"
      - "1:maj/3 1:7/b7"
      - "4:maj 4:m/#5"
      - "7:m7b5 3:7"
      - "6:m7 2:7"
      - "2:m7/5 5:7"
    lead:
      instrument: hook
      melody: hook_ab
      layers:
        - instrument: sslead
          transpose: -12
    drums: mega
    bass:
      pattern: '808'
      add_parts:
        subbass: R - - . | R - - . | R - - . | R - - .
    comp:
      supersaw: hold
      chrome: tresillo
    arp: {instrument: crystal, pattern: crystal}
    counter: {instrument: bell, pattern: bell}
    answers:
      - {instrument: chop, melody: answers.mid, at: {bar: 2, step: 1}}
      - {instrument: chop, melody: answers.gap, at: {bar: 4, step: 1}}
    velocity: 124
    events:
      - {macro: drop}
  outro:
    chords:
      - "1:maj"
      - "1:maj"
    placements:
      - {instrument: donk, melody: riff, take_notes: 4, transpose: -12, velocity: 112, at: {bar: 1, step: 1}}
      - {instrument: tapestop, chord: "1:maj", voicing_floor_midi: 50, add_root_degree: '3,,,', at: {bar: 1, step: 6}, duration_steps: 7}
      - {instrument: chop, degree: '5', at: {bar: 1, step: 14}, duration_steps: 1.5, velocity: 122, mark: hey}
      - {instrument: supersaw, chord: "1:maj", voicing_floor_midi: 48, at: {bar: 2, step: 1}, duration_steps: 12}
      - {instrument: chrome, chord: "1:maj", voicing_floor_midi: 60, at: {bar: 2, step: 1}, duration_steps: 3}
      - {instrument: hook, degree: '1', at: {bar: 2, step: 1}, duration_steps: 8}
      - {instrument: singer, degree: '1', at: {bar: 2, step: 1}, duration_steps: 8}
      - {instrument: b808, bass_note: R, at: {bar: 2, step: 1}, duration_steps: 12, velocity: 125}
      - {instrument: subdrop, bass_note: R', at: {bar: 2, step: 1}, duration_steps: 12}
    events:
      - {kind: hits, at: {bar: 2, step: 1}, instruments: [kick, clap, crash, impact]}
